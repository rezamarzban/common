<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geo URI (u=35)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
    input { width: 100%; padding: 12px; font-size: 1.2rem; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 14px; font-size: 1.2rem; background: #1e3a5f; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .output { margin-top: 24px; padding: 16px; background: #f3f5f9; border-radius: 12px; }
    a.geo-link { display: inline-block; margin: 8px 0; font-size: 1.3rem; word-break: break-all; }
    .raw { font-family: monospace; opacity: 0.8; }
    .error { color: #c00; margin-top: 8px; }
  </style>
</head>
<body>
<h2>📍 geo:lat,lon;u=35</h2>
<input type="text" id="coordInput" placeholder="e.g. 27.33088, 51.99239">
<button id="generateBtn">Generate link</button>

<div class="output">
  <a href="#" id="geoAnchor" class="geo-link"></a>
  <div class="raw" id="rawUri"></div>
  <div id="errorMsg" class="error"></div>
</div>

<script>
  const U = 35;
  const input = document.getElementById('coordInput');
  const anchor = document.getElementById('geoAnchor');
  const rawSpan = document.getElementById('rawUri');
  const errorDiv = document.getElementById('errorMsg');

  function parseCoords(str) {
    const cleaned = str.replace(/[°º˚]/g, '').trim();
    const parts = cleaned.split(',').map(p => p.trim());
    if (parts.length !== 2) {
      const nums = cleaned.match(/-?\d+\.?\d*/g);
      if (!nums || nums.length < 2) return null;
      return { lat: parseFloat(nums[0]), lon: parseFloat(nums[1]) };
    }
    return { lat: parseFloat(parts[0]), lon: parseFloat(parts[1]) };
  }

  function update() {
    const val = input.value.trim();
    if (!val) {
      anchor.textContent = '';
      anchor.removeAttribute('href');
      rawSpan.textContent = '';
      errorDiv.textContent = '';
      return;
    }
    const parsed = parseCoords(val);
    if (!parsed || isNaN(parsed.lat) || isNaN(parsed.lon)) {
      anchor.textContent = 'Invalid format';
      anchor.removeAttribute('href');
      rawSpan.textContent = '';
      errorDiv.textContent = '❌ Use "lat, lon" e.g. 27.33088, 51.99239';
      return;
    }
    const { lat, lon } = parsed;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      anchor.textContent = 'Out of range';
      anchor.removeAttribute('href');
      rawSpan.textContent = `lat ${lat} / lon ${lon}`;
      errorDiv.textContent = '⚠️ lat -90..90, lon -180..180';
      return;
    }
    const uri = `geo:${lat},${lon};u=${U}`;
    anchor.href = uri;
    anchor.textContent = `🌐 ${lat}°, ${lon}° (open maps)`;
    rawSpan.textContent = uri;
    errorDiv.textContent = '';
  }

  document.getElementById('generateBtn').addEventListener('click', update);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') update(); });
</script>
</body>
</html>
