name: extract a zip file

on:
  push:
    paths:
      - 'uploads/**/*.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          set -e

          rm -rf uploads/extracted temp

          zipfile=$(find uploads -maxdepth 1 -name '*.zip' | head -n 1)
          filename=$(basename "$zipfile" .zip)

          unzip "$zipfile" -d temp
          rm "$zipfile"

          if [ -d "temp/$filename/out" ]; then
            mv "temp/$filename/out/"* .
          elif [ -d "temp/out" ]; then
            mv temp/out/* .
          else
            mv temp/* .
          fi

          rm -rf temp

          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name "github-actions"

          git add .
          git commit -m "unzip" || echo "No changes to commit"
          git push origin main
