name: extract zip files

on:
  push:
    paths:
      - 'uploads/**/*.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract all zip files
        run: |
          set -e
          shopt -s nullglob

          for zipfile in uploads/*.zip; do
            echo "Processing $zipfile"

            dirname=$(basename "$zipfile" .zip)
            target="uploads/$dirname"

            mkdir -p "$target"

            # Extract and overwrite existing files if needed
            unzip -oq "$zipfile" -d "$target"

            # Remove ZIP after successful extraction
            rm -f "$zipfile"
          done

      - name: Commit changes
        run: |
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name "github-actions"

          git add uploads

          git diff --cached --quiet || git commit -m "Extract zip files"

          git push
